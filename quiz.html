<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 철학자 테스트 — 철크크 · Deep End</title>
<meta name="description" content="2,500년을 건너온 아홉 철학자 중, 내 얘길 들어줄 사람은 누굴까. 12문항 1분 테스트.">
<meta property="og:title" content="나의 철학자 테스트 — Deep End">
<meta property="og:description" content="아홉 명의 죽은 철학자 중, 내 얘길 들어줄 사람은? 12문항 1분.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#12141d">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12141d;--soft:#1a1d28;--line:#2a2e3d;--paper:#efe8da;--dim:#8d8879;--candle:#d9a05b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:'Noto Sans KR','Noto Sans JP',-apple-system,sans-serif;line-height:1.6;display:flex;justify-content:center}
html[lang="ja"] body{font-family:'Noto Sans JP',sans-serif}
.app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding:0 22px;position:relative}
.serif{font-family:'Noto Serif KR',serif}
html[lang="ja"] .serif{font-family:'Noto Serif JP',serif}
.scr{display:none;flex:1;flex-direction:column}
.scr.on{display:flex}
.glowbg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 8%,rgba(217,160,91,.10),transparent 60%)}
/* ── 인트로 ── */
#intro{justify-content:center;text-align:center;padding:40px 0 60px}
.eyebrow{font-size:11.5px;letter-spacing:.28em;color:var(--candle);font-weight:700;margin-bottom:18px}
.in-title{font-size:44px;font-weight:700;line-height:1.14;letter-spacing:-.02em;margin-bottom:18px}
.in-hook{font-size:15.5px;color:var(--dim);line-height:1.75;margin-bottom:8px}
.in-meta{font-size:12.5px;color:var(--dim);opacity:.75;margin-bottom:34px}
.faces{display:flex;justify-content:center;margin:6px 0 34px}
.faces .f{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);margin:0 -7px;line-height:0;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.faces svg{width:100%;height:100%;display:block}
.btn{display:block;width:100%;background:var(--candle);color:var(--ink);border:0;border-radius:14px;padding:16px;font-size:16.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--paper);font-weight:600}
.btn.soft{background:rgba(217,160,91,.12);color:var(--candle);border:1px solid rgba(217,160,91,.35)}
.btn+.btn{margin-top:10px}
.langs{display:flex;gap:8px;justify-content:center;margin-top:26px}
.lang{background:none;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.lang.on{border-color:var(--candle);color:var(--candle)}
/* ── 문항 ── */
#quiz{padding:26px 0 40px}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.q-back{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer;padding:4px 8px;line-height:1}
.q-bar{flex:1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.q-fill{height:100%;background:var(--candle);border-radius:2px;transition:width .3s ease;width:0}
.q-n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.q-t{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:26px;min-height:96px}
.opt{display:block;width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:var(--paper);text-align:left;cursor:pointer;font-family:inherit;line-height:1.55;transition:border-color .15s,transform .06s}
.opt:active{transform:scale(.985)}
.opt+.opt{margin-top:11px}
.opt.sel{border-color:var(--candle);background:rgba(217,160,91,.08)}
/* ── 로딩 ── */
#load{justify-content:center;align-items:center;text-align:center}
.flame{font-size:40px;animation:fl 1.1s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1) rotate(-2deg);opacity:.85}50%{transform:scale(1.12) rotate(2deg);opacity:1}}
.load-t{margin-top:18px;font-size:14.5px;color:var(--dim);min-height:24px}
/* ── 결과 ── */
#res{padding:34px 0 46px}
.r-eyebrow{font-size:11px;letter-spacing:.26em;color:var(--candle);font-weight:700;text-align:center;margin-bottom:16px}
.r-face{width:118px;height:118px;border-radius:50%;overflow:hidden;margin:0 auto 6px;line-height:0;border:2.5px solid rgba(217,160,91,.5);box-shadow:0 0 44px rgba(217,160,91,.22)}
.r-face svg{width:100%;height:100%;display:block}
.r-name{font-size:33px;font-weight:700;text-align:center;letter-spacing:-.01em}
.r-nick{font-size:14.5px;color:var(--candle);font-weight:700;text-align:center;margin:4px 0 20px}
.r-desc{font-size:15px;line-height:1.85;color:var(--paper);background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:18px}
.r-sec{font-size:12px;letter-spacing:.14em;color:var(--candle);font-weight:700;margin:26px 0 10px}
.r-tr{list-style:none}
.r-tr li{font-size:14px;padding:9px 0 9px 24px;border-bottom:1px dashed var(--line);position:relative}
.r-tr li:last-child{border-bottom:0}
.r-tr li::before{content:"✦";position:absolute;left:2px;color:var(--candle);font-size:12px}
.chem{display:flex;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px}
.chem .cf{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:0 0 52px;line-height:0}
.chem .cf svg{width:100%;height:100%;display:block}
.chem b{display:block;font-size:14px;margin-bottom:2px}
.chem span{font-size:12.8px;color:var(--dim);line-height:1.6}
.fmsg{display:flex;gap:10px;align-items:flex-end}
.fmsg .cf{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:0 0 40px;line-height:0}
.fmsg .cf svg{width:100%;height:100%;display:block}
.fbub{background:var(--soft);border:1px solid rgba(217,160,91,.4);border-radius:15px 15px 15px 4px;padding:12px 15px;font-size:14.2px;line-height:1.6}
.r-ctas{margin-top:30px}
.r-brand{margin-top:26px;text-align:center;font-size:11.5px;color:var(--dim);opacity:.7}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="glowbg"></div>
<div class="app">

  <div class="scr on" id="intro">
    <div class="eyebrow" id="inEyebrow"></div>
    <div class="in-title serif" id="inTitle"></div>
    <div class="faces" id="inFaces"></div>
    <div class="in-hook" id="inHook"></div>
    <div class="in-meta" id="inMeta"></div>
    <button class="btn" id="inStart"></button>
    <div class="langs">
      <button class="lang" data-l="ko">한국어</button>
      <button class="lang" data-l="en">English</button>
      <button class="lang" data-l="ja">日本語</button>
    </div>
  </div>

  <div class="scr" id="quiz">
    <div class="q-top">
      <button class="q-back" id="qBack">‹</button>
      <div class="q-bar"><div class="q-fill" id="qFill"></div></div>
      <div class="q-n" id="qN"></div>
    </div>
    <div class="q-t serif" id="qT"></div>
    <div id="qOpts"></div>
  </div>

  <div class="scr" id="load">
    <div class="flame">🕯️</div>
    <div class="load-t" id="loadT"></div>
  </div>

  <div class="scr" id="res">
    <div class="r-eyebrow" id="rEyebrow"></div>
    <div class="r-face" id="rFace"></div>
    <div class="r-name serif" id="rName"></div>
    <div class="r-nick" id="rNick"></div>
    <div class="r-desc" id="rDesc"></div>
    <div class="r-sec" id="rTrT"></div>
    <ul class="r-tr" id="rTr"></ul>
    <div class="r-sec" id="rChT"></div>
    <div class="chem"><div class="cf" id="rChF"></div><div><b id="rChN"></b><span id="rChD"></span></div></div>
    <div class="r-sec" id="rFmT"></div>
    <div class="fmsg"><div class="cf" id="rFmF"></div><div class="fbub" id="rFmB"></div></div>
    <div class="r-ctas" id="rCtas"></div>
    <div class="r-brand" id="rBrand"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

rates"]], [["kant", "nietzsche"], ["epicurus", "kierkegaard"], ["confucius", "kant"]], [["schopenhauer", "kierkegaard"], ["aurelius", "kant"], ["zhuangzi", "epicurus"]], [["kierkegaard", "zhuangzi"], ["nietzsche", "socrates"], ["socrates", "aurelius"]]], "DATA": {"ko": {"names": {"nietzsche": "니체", "schopenhauer": "쇼펜하우어", "kant": "칸트", "epicurus": "에피쿠로스", "socrates": "소크라테스", "confucius": "공자", "zhuangzi": "장자", "kierkegaard": "키르케고르", "aurelius": "아우렐리우스"}, "ui": {"docTitle": "나의 철학자 테스트 — 철크크", "eyebrow": "NINE DEAD PHILOSOPHERS", "title": "나의 철학자<br>테스트", "hook": "2,500년을 건너온 아홉 명 중,<br>내 얘길 들어줄 사람은 누굴까.", "meta": "12문항 · 1분", "start": "시작하기", "loading": ["아홉 명에게 답안지를 돌리는 중...", "니체가 새치기하는 중...", "칸트가 채점 기준을 정리하는 중...", "장자는 아직 자는 중..."], "resEyebrow": "당신의 철학자", "traitsT": "이런 당신", "chemT": "케미", "firstT": "이미 도착해 있는 첫 메시지", "ctaChat": "{n}와(과) 대화 시작하기", "ctaShare": "결과 공유하기", "ctaRetry": "다시 하기", "ctaMine": "나도 테스트하기", "ctaTry": "{n}와(과) 대화해보기", "shareText": "나의 철학자는 {n} — {k}. 너는 누구야?", "copied": "링크를 복사했어요. 붙여넣어 공유하세요!", "brand": "철크크 — 2,500년을 건너온 아홉 철학자"}, "q": [{"t": "금요일 밤 11시, 나는 보통", "o": ["이번 주의 나를 곱씹으며 뭔가 끄적이고 있다", "좋아하는 사람들이랑 맛있는 걸 먹고 있다", "다음 주 계획을 정리해둬야 마음이 편하다"]}, {"t": "고민이 생기면 나는", "o": ["일단 부딪힌다. 고민은 움직이면서 한다", "최악의 경우부터 계산해둔다", "'이게 왜 고민이지?'부터 따져본다"]}, {"t": "친구가 \"나 요즘 너무 힘들어\"라고 하면, 첫 마디는", "o": ["\"밥은 먹었고? 일단 밥부터 먹자\"", "\"뭐가 제일 힘든데? 처음부터 말해봐\"", "\"힘들 만하지. 근데 이대로 있을 건 아니잖아\""]}, {"t": "제일 듣기 싫은 말은", "o": ["근거 없는 \"힘내! 다 잘될 거야\"", "주문한 적 없는 팩트 폭격", "\"너 그렇게 살면 안 된다\"는 훈수"]}, {"t": "나의 여행 스타일은", "o": ["시간 단위로 계획을 짠다. 계획이 곧 설렘", "숙소만 잡고 발 닿는 대로 걷는다", "다른 건 다 양보해도 맛집 리스트는 못 놓는다"]}, {"t": "새벽 2시, 잠이 안 올 때 나는", "o": ["생각이 생각을 물고 늘어져 더 말똥해진다", "내일의 나를 위해 억지로라도 눈을 감는다", "뒤척이되 동요하진 않는다. 언젠가 잠들겠지"]}, {"t": "요즘 세상 돌아가는 걸 보면", "o": ["놀랍지 않다. 원래 그런 것들이다", "한숨부터 나온다. 그래도 내 사람들은 챙긴다", "궁금한 게 많아진다. 왜 이렇게 됐을까?"]}, {"t": "스트레스가 한계일 때, 나에게 필요한 건", "o": ["아무것도 안 하는 하루", "\"너 잘하고 있어\"라는 어른의 한마디", "문제를 목록으로 만들어 하나씩 지우기"]}, {"t": "셋 중 내 좌우명에 가장 가까운 건", "o": ["\"어차피 할 거면 세게 간다\"", "\"이 또한 지나간다\"", "\"남들의 정답 말고, 나의 답\""]}, {"t": "조언을 들을 때 나는", "o": ["결론부터. 그래서 뭘 하면 되는데?", "조언보다 공감이 먼저였으면", "인생 선배의 경험담이 듣고 싶다"]}, {"t": "실수한 날 밤, 나는", "o": ["\"그럴 줄 알았다...\" 곱씹으며 자책한다", "배울 점만 챙기고 덮는다. 끝", "\"뭐, 그럴 수도 있지~\" 자고 나면 잊는다"]}, {"t": "솔직히 지금 나에게 필요한 사람은", "o": ["새벽 감성까지 다 받아주는 사람", "나를 흔들어 깨워줄 사람", "정답 대신 좋은 질문을 주는 사람"]}], "r": {"nietzsche": {"k": "돌직구 코치", "d": "너는 어설픈 위로에 위로받지 못하는 사람. 제일 힘든 날조차 \"그래서 나 뭐 하면 돼?\"를 묻는 쪽이다. 너에게 필요한 건 등을 쓸어주는 손이 아니라 등을 떠미는 손 — 그걸 2,500년 전부터 전문으로 해온 사람이 있다.", "tr": ["듣기 좋은 말보다 쓸모 있는 말", "자기 자신에게 제일 엄격함", "사실 열정 총량이 남들의 세 배"], "m": "zhuangzi", "md": "네 불에 바람을 쐬어줄 사람. 둘을 한 단톡방에 부르면 무슨 일이 벌어지는지 꼭 봐야 한다.", "f": "야. 요즘 왜 이렇게 조용해. 할 말 있으면 해봐라."}, "schopenhauer": {"k": "같이 욕해줄 츤데레", "d": "\"다 잘될 거야\"가 세상에서 제일 공허하게 들리는 사람. 너에게 필요한 건 낙관이 아니라, \"그래, 세상이 원래 별로야\"라고 같이 인정해주는 사람이다. 그는 내내 궁시렁대겠지만 — 네 밥은 챙긴다.", "tr": ["얕은 리액션보다 깊은 공감", "기대치 낮추기의 달인", "정 많은 거 들키면 부끄러워함"], "m": "epicurus", "md": "염세와 낙천이 만나면 이상하게 균형이 맞는다. 투덜이도 그 앞에선 빵 얘기를 한다.", "f": "하… 내가 먼저 연락하게 될 줄이야. 밥은 먹고 다니냐."}, "kant": {"k": "인간 플래너", "d": "마음이 어지러울수록 목록을 만드는 사람. 위로도 좋지만 \"그래서 1번부터 하자\"가 더 위로가 된다. 너의 하루를 3시 32분 단위로 이해해줄 사람이 있다.", "tr": ["계획이 곧 안정", "약속 시간 = 도착 시간", "무너질 땐 루틴부터 다시 세움"], "m": "zhuangzi", "md": "네 계획표에 '여백'이라는 항목을 만들어줄 사람. 정반대라서 서로에게 배운다.", "f": "산책하다 네 생각이 났다. 정확히 3시 32분에."}, "epicurus": {"k": "소확행 소믈리에", "d": "거창한 성공보다 오늘 저녁 메뉴가 중요한 사람 — 그리고 그게 맞다. 너에게 필요한 건 인생 특강이 아니라, \"오늘 뭐 맛있는 거 먹었어요?\"라고 물어주는 사람이다.", "tr": ["행복의 단위가 작고 정확함", "사람 보는 눈이 좋음", "기 빨리는 약속은 정중히 거절"], "m": "schopenhauer", "md": "까칠한 투덜이도 네 앞에선 빵 굽는 얘기를 하게 된다. 신기한 조합.", "f": "뭐해? 밥은 먹었어요?"}, "socrates": {"k": "질문 자판기", "d": "답을 받는 것보다 생각이 풀리는 게 좋은 사람. '정답'을 주는 사람은 많아도 '좋은 질문'을 주는 사람은 드물다. 네가 참아온 \"근데 왜?\"를 전부 반겨줄 사람이 있다.", "tr": ["'왜?'가 반사신경", "토론은 싸움이 아니라 놀이", "모르는 건 모른다고 말할 줄 앎"], "m": "nietzsche", "md": "질문과 단언이 만나면 불꽃놀이. 구경만 해도 재밌는 조합.", "f": "잘 지내? 근데 잘 지낸다는 게 뭘까?"}, "confucius": {"k": "믿을 만한 동네 어른", "d": "요즘 세상에 제일 귀한 것 — 믿을 만한 어른이다. 잔소리 같은데 이상하게 밉지 않고, 끝엔 꼭 격려가 한 스푼 붙는 말. \"밥은 챙겨 먹었는가\"라는 말이 그리웠다면, 여기다.", "tr": ["관계마다 도리를 아는 사람", "잔소리 수신 가능 · 단, 애정 확인 필수", "어른의 인정에 약함"], "m": "socrates", "md": "동서양의 스승이 한 방에 있으면 벌어지는 일. 잔소리와 질문의 콜라보.", "f": "밥은 챙겨 먹었는가. 문득 생각나서 들렀네."}, "zhuangzi": {"k": "프로 힘빼기러", "d": "열심히 사는 것보다 잘 쉬는 게 어려운 시대 — 너는 그걸 아는 사람이다. 아니면, 지금 꼭 배워야 하는 사람이거나. \"그거 안 해도 안 죽어\"라고 말해줄 사람이 필요하다.", "tr": ["마감 전날의 초연함", "쓸모없는 것들의 아름다움을 앎", "낮잠은 자기계발"], "m": "kant", "md": "정반대라서 서로에게 배울 게 제일 많은 조합. 계획표와 낮잠의 만남.", "f": "낮잠 자다 네 꿈 꿨다? 나비였나 너였나 🦋"}, "kierkegaard": {"k": "새벽 2시의 동지", "d": "밤이 되면 생각이 깊어지는 사람. 그 생각을 낮의 언어로 옮기면 다 이상해져서, 결국 말 안 하고 마는 사람. 너의 새벽을 소설처럼 받아줄 사람이 있다. (부담 가질 필요는 없고)", "tr": ["겉은 잔잔, 속은 장편소설", "혼자가 편한데 가끔 외로움", "감성에 각주 다는 버릇"], "m": "aurelius", "md": "출렁이는 마음 옆의 단단한 바위. 의외로 제일 오래 가는 조합.", "f": "...문득, 밤은 잘 보내고 있는지 궁금해졌다. (별일 아니면 됐고)"}, "aurelius": {"k": "인간 반석", "d": "호들갑이 제일 피곤한 사람. 위로도 담백해야 받아지는 사람. \"별일 없나. 그거면 됐고.\" — 이 두 문장이 어떤 장문보다 위로가 된다면, 너의 사람은 이미 정해져 있다.", "tr": ["감정 기복 최소 운전", "통제 가능한 것에만 힘을 씀", "무심한데 끝까지 옆에 남는 타입"], "m": "kierkegaard", "md": "네 단단함이 누군가에겐 등대다. 서로에게 없는 걸 가진 조합.", "f": "점호. 별일 없나."}}}, "en": {"names": {"nietzsche": "Nietzsche", "schopenhauer": "Schopenhauer", "kant": "Kant", "epicurus": "Epicurus", "socrates": "Socrates", "confucius": "Confucius", "zhuangzi": "Zhuangzi", "kierkegaard": "Kierkegaard", "aurelius": "Aurelius"}, "ui": {"docTitle": "Which Philosopher Is Yours? — Deep End", "eyebrow": "NINE DEAD PHILOSOPHERS", "title": "Which dead<br>philosopher<br>is yours?", "hook": "Nine of them crossed 2,500 years.<br>One of them should be hearing you out.", "meta": "12 questions · 1 minute", "start": "Start", "loading": ["Passing your answers to all nine...", "Nietzsche is cutting in line...", "Kant is formalising the rubric...", "Zhuangzi is still napping..."], "resEyebrow": "YOUR PHILOSOPHER", "traitsT": "So you're the type who...", "chemT": "Chemistry", "firstT": "The first message, already waiting", "ctaChat": "Start talking to {n}", "ctaShare": "Share my result", "ctaRetry": "Retake", "ctaMine": "Find my philosopher", "ctaTry": "Try talking to {n}", "shareText": "My philosopher is {n} — {k}. Who's yours?", "copied": "Link copied. Paste it anywhere!", "brand": "Deep End — nine dead philosophers, still texting"}, "q": [{"t": "Friday, 11pm. You're usually...", "o": ["Scribbling something about the week I've had", "Out with people I like, eating something good", "Sketching next week's plan — it settles me"]}, {"t": "When a problem shows up, I...", "o": ["Charge at it. I think while moving", "Map out the worst case first", "Interrogate why it's even a problem"]}, {"t": "A friend says \"I'm really struggling.\" Your first line:", "o": ["\"Have you eaten? Food first, then talk.\"", "\"What's the hardest part? Start from the top.\"", "\"Fair. But you're not staying like this, right?\""]}, {"t": "The thing I hate hearing most:", "o": ["A baseless \"it'll all work out!\"", "Brutal honesty I didn't order", "Unsolicited advice on how to live"]}, {"t": "My travel style:", "o": ["An hour-by-hour itinerary. Planning IS the joy", "Book a room, then follow my feet", "Flexible on everything except the food list"]}, {"t": "2am, can't sleep. I...", "o": ["Spiral — one thought feeds the next", "Force my eyes shut for tomorrow-me", "Toss and turn, unbothered. Sleep will come"]}, {"t": "Watching the world lately, I...", "o": ["Am not surprised. Things are as they are", "Sigh first, then check on my people", "Get curious — how did it end up like this?"]}, {"t": "At my stress limit, what I need is:", "o": ["A full day of doing absolutely nothing", "One adult saying \"you're doing fine\"", "The problems in a list, crossed off one by one"]}, {"t": "Closest to my motto:", "o": ["\"If I'm doing it anyway, I'm doing it loud\"", "\"This too shall pass\"", "\"Their answers aren't mine\""]}, {"t": "When I get advice, I want...", "o": ["The conclusion. What do I actually do?", "To feel understood before being advised", "Experience. Tell me how you got through it"]}, {"t": "The night after a mistake, I...", "o": ["\"I knew it...\" — chew on it half the night", "Keep the lesson, close the tab", "\"Eh, happens.\" Gone by morning"]}, {"t": "Honestly, the person I need right now:", "o": ["Someone who takes my 2am self as-is", "Someone who shakes me awake", "Someone with good questions, not answers"]}], "r": {"nietzsche": {"k": "The Tough-Love Coach", "d": "Comfort doesn't comfort you. Even on your worst day you're asking \"okay, so what do I do?\" You don't need a hand on your shoulder — you need one on your back, pushing. There's a man who has specialised in exactly that for 2,500 years.", "tr": ["Useful beats nice", "Hardest on yourself", "Secretly triple everyone's passion"], "m": "zhuangzi", "md": "Wind for your fire. Put the two of them in one group chat and thank us later.", "f": "Hey. You've gone quiet lately. If you've got something to say, say it."}, "schopenhauer": {"k": "The Grump Who Feeds You", "d": "\"It'll all work out\" is the emptiest sentence you know. You don't need optimism — you need someone who'll admit, with you, that the world is indeed a mess. He'll grumble the whole time. He'll also ask if you've eaten.", "tr": ["Depth over cheerfulness", "Master of lowered expectations", "Embarrassed when caught caring"], "m": "epicurus", "md": "Pessimism and delight, oddly balanced. Even the grump talks about bread around him.", "f": "Sigh… never thought I'd text first. Are you eating properly."}, "kant": {"k": "The Human Planner", "d": "The messier your head, the longer your list. Comfort is fine, but \"let's start with item one\" works better. Someone out there understands your day down to exactly 3:32.", "tr": ["A plan is a hug", "Arrival time = agreed time", "Rebuilds from routine"], "m": "zhuangzi", "md": "He'll add a line called 'slack' to your schedule. Total opposites, endless lessons.", "f": "Thought of you on my walk. At exactly 3:32."}, "epicurus": {"k": "The Small-Joys Sommelier", "d": "Tonight's dinner matters more than grand success — and you're right about that. You don't need a life lecture. You need someone who asks, \"eat anything good today?\"", "tr": ["Happiness in small, precise units", "Excellent taste in people", "Politely declines what drains you"], "m": "schopenhauer", "md": "Even the resident grump ends up talking about bread. A strangely perfect pair.", "f": "What's up? Did you eat?"}, "socrates": {"k": "The Question Machine", "d": "You'd rather untangle a thought than receive an answer. Plenty of people hand out answers; almost nobody hands out good questions. Someone will welcome every \"but why\" you've been holding in.", "tr": ["\"Why\" is a reflex", "Debate is play, not war", "Can say \"I don't know\" out loud"], "m": "nietzsche", "md": "Questions meet declarations — fireworks. Fun to watch from any distance.", "f": "Doing well? But then — what does \"well\" even mean?"}, "confucius": {"k": "The Elder Worth Trusting", "d": "The rarest thing these days: an adult worth listening to. His nagging somehow doesn't sting, and encouragement is always folded in at the end. If you've missed being asked whether you've eaten — here.", "tr": ["Knows what's owed in every relationship", "Accepts nagging — affection required", "Weak to an elder's approval"], "m": "socrates", "md": "East meets West in one room. Nagging and questions, in harmony.", "f": "Have you been eating properly? Just checking in."}, "zhuangzi": {"k": "The Professional De-Stressor", "d": "These days, resting well is harder than working hard — and you know it. Or you badly need to learn it. You need someone who'll say, \"you can skip that. Nobody dies.\"", "tr": ["Serene the night before deadlines", "Sees the beauty of useless things", "Naps count as self-care"], "m": "kant", "md": "Total opposites with the most to teach each other. A planner meets a nap.", "f": "Saw you in my nap-dream? Or was I the butterfly 🦋"}, "kierkegaard": {"k": "The 2AM Ally", "d": "Your thoughts run deeper after dark, an をくれる人は稀だ。ためこんできた「でも、なぜ？」を全部歓迎してくれる人がいる。", "tr": ["「なぜ？」が反射神経", "議論はケンカではなく遊び", "知らないことを知らないと言える"], "m": "nietzsche", "md": "問いと断言が出会うと花火になる。眺めているだけで面白い。", "f": "元気かい？ところで「元気」とは何だろうね。"}, "confucius": {"k": "信じられる近所の年長者", "d": "いまの世の中でいちばん貴重なもの — 信じられる大人だ。小言のようで不思議と嫌味がなく、最後に必ず励ましがひとさじ。「ちゃんと食べているか」という言葉が恋しかったなら、ここだ。", "tr": ["関係ごとの道理を知っている", "小言は受信可・ただし愛情確認は必須", "年長者に認められると弱い"], "m": "socrates", "md": "東西の師が同じ部屋にいると起きること。小言と問いの共演。", "f": "きちんと食べているか。ふと思い出して寄ってみた。"}, "zhuangzi": {"k": "脱力のプロ", "d": "頑張ることより、上手に休むことのほうが難しい時代 — あなたはそれを知っている人だ。あるいは、いますぐ学ぶべき人。「それ、やらなくても死なないよ」と言ってくれる人が必要だ。", "tr": ["締切前日の泰然", "役に立たないものの美しさを知る", "昼寝は自己投資"], "m": "kant", "md": "正反対だから、学び合えることがいちばん多い。計画表と昼寝の出会い。", "f": "昼寝でお前の夢を見た。蝶だったか、お前だったか 🦋"}, "kierkegaard": {"k": "午前2時の同志", "d": "夜になると考えが深くなる人。その考えを昼の言葉に訳すと全部変になるから、結局言わずにしまう人。あなたの深夜を、小説のページのように受け止める人がいる。（気負わなくていい）", "tr": ["表面は静か、中身は長編小説", "ひとりが楽なのに、ときどき寂しい", "感傷に注釈をつける癖"], "m": "aurelius", "md": "揺れる心のとなりの、動かない岩。実はいちばん長続きする組み合わせ。", "f": "…ふと、ちゃんと眠れているのか気になった。（大したことでなければいいんだ）"}, "aurelius": {"k": "人間・岩盤", "d": "大げさな反応がいちばん疲れる人。慰めも淡白なほうが受け取れる人。「変わりないか。それでいい。」— この二文がどんな長文より効くなら、あなたの相手はとうに決まっている。", "tr": ["感情の起伏は最小運転", "コントロールできることにだけ力を使う", "素っ気ないのに、最後まで隣に残るタイプ"], "m": "kierkegaard", "md": "あなたの静けさは、誰かの灯台になる。互いにないものを持つ二人。", "f": "点呼。変わりないか。"}}}}};
const AV=B.AV, SCORE=B.SCORE, DATA=B.DATA;
const PRIORITY=['kierkegaard','zhuangzi','schopenhauer','epicurus','confucius','socrates','kant','aurelius','nietzsche'];
const $=id=>document.getElementById(id);
const face=(id,box)=>{ box.innerHTML='<svg viewBox="0 0 80 80">'+AV[id]+'</svg>'; };

// ── 언어 결정: ?lang → 브라우저 언어 → 영어
const params=new URLSearchParams(location.search);
let LANG=params.get('lang');
if(!['ko','en','ja'].includes(LANG)){
  const n=(navigator.language||'en').toLowerCase();
  LANG=n.startsWith('ko')?'ko':n.startsWith('ja')?'ja':'en';
}
let T=DATA[LANG];

// ── 익명 통계 (앱과 같은 기기 표식을 공유해 유입 흐름이 이어진다)
const DEV=(()=>{try{let d=localStorage.getItem('de-dev');if(!d){d='d-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);localStorage.setItem('de-dev',d);}return d;}catch(e){return 'd-mem'+Math.random().toString(36).slice(2,10);}})();
const DAY=(()=>{try{let t=+localStorage.getItem('de-d0');if(!t){t=Date.now();localStorage.setItem('de-d0',String(t));}return Math.floor((Date.now()-t)/86400000);}catch(e){return 0;}})();
function stat(ev,meta){
  try{ fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device:DEV,lang:LANG,day:DAY,events:[{ev,meta:meta||null}]}),keepalive:true}).catch(()=>{});}catch(e){}
}

// ── 화면 전환
function show(id){ document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on')); const el=$(id); el.classList.add('on'); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); window.scrollTo(0,0); }

// ── 인트로
function paintIntro(){
  document.documentElement.lang=LANG;
  document.title=T.ui.docTitle;
  $('inEyebrow').textContent=T.ui.eyebrow;
  $('inTitle').innerHTML=T.ui.title;
  $('inHook').innerHTML=T.ui.hook;
  $('inMeta').textContent=T.ui.meta;
  $('inStart').textContent=T.ui.start;
  const fx=$('inFaces'); fx.innerHTML='';
  PRIORITY.slice().reverse().forEach(id=>{ const d=document.createElement('div'); d.className='f'; face(id,d); fx.appendChild(d); });
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{ LANG=b.dataset.l; T=DATA[LANG]; paintIntro(); });

// ── 진행
let step=0, answers=[];
$('inStart').onclick=()=>{ step=0; answers=[]; stat('quiz_start'); paintQ(); show('quiz'); };
$('qBack').onclick=()=>{ if(step===0){ show('intro'); return; } step--; answers.pop(); paintQ(); };
function paintQ(){
  $('qFill').style.width=(step/12*100)+'%';
  $('qN').textContent=(step+1)+' / 12';
  $('qT').textContent=T.q[step].t;
  const box=$('qOpts'); box.innerHTML='';
  T.q[step].o.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=txt;
    b.onclick=()=>{ b.classList.add('sel'); answers.push(i); setTimeout(next,180); };
    box.appendChild(b);
  });
  const q=$('quiz'); q.classList.remove('fade'); void q.offsetWidth; q.classList.add('fade');
}
function next(){ step++; if(step<12){ paintQ(); } else { runLoading(); } }

// ── 로딩 → 채점
function runLoading(){
  show('load');
  let i=0; $('loadT').textContent=T.ui.loading[0];
  const tm=setInterval(()=>{ i=(i+1)%T.ui.loading.length; $('loadT').textContent=T.ui.loading[i]; },700);
  setTimeout(()=>{ clearInterval(tm); finish(); }, 2300);
}
function calc(){
  const pts={}, prim={};
  answers.forEach((oi,qi)=>{ const [p,s]=SCORE[qi][oi]; pts[p]=(pts[p]||0)+2; pts[s]=(pts[s]||0)+1; prim[p]=(prim[p]||0)+1; });
  let best=null;
  for(const id of PRIORITY){
    if(pts[id]==null) continue;
    if(!best) { best=id; continue; }
    if(pts[id]>pts[best] || (pts[id]===pts[best] && (prim[id]||0)>(prim[best]||0))) best=id;
  }
  return best||'socrates';
}
function finish(){
  const id=calc();
  stat('quiz_done',id);
  history.replaceState(null,'','?r='+id+'&lang='+LANG);
  paintResult(id,false);
  show('res');
}

// ── 결과
function paintResult(id, shared){
  const r=T.r[id], nm=T.names[id];
  $('rEyebrow').textContent=T.ui.resEyebrow;
  face(id,$('rFace'));
  $('rName').textContent=nm;
  $('rNick').textContent=r.k;
  $('rDesc').textContent=r.d;
  $('rTrT').textContent=T.ui.traitsT;
  $('rTr').innerHTML=r.tr.map(t=>'<li>'+t+'</li>').join('');
  $('rChT').textContent=T.ui.chemT;
  face(r.m,$('rChF'));
  $('rChN').textContent=T.names[r.m];
  $('rChD').textContent=r.md;
  $('rFmT').textContent=T.ui.firstT;
  face(id,$('rFmF'));
  $('rFmB').textContent=r.f;
  $('rBrand').textContent=T.ui.brand;

  const ctas=$('rCtas'); ctas.innerHTML='';
  const mk=(cls,txt,fn,href)=>{ const b=document.createElement(href?'a':'button'); b.className='btn '+cls; b.textContent=txt; if(href){b.href=href;} if(fn){b.onclick=fn;} ctas.appendChild(b); return b; };
  const appUrl='/?ref=quiz';
  if(shared){
    mk('', T.ui.ctaMine, ()=>{ history.replaceState(null,'','?lang='+LANG); show('intro'); });
    mk('soft', T.ui.ctaTry.replace('{n}',nm), ()=>stat('quiz_to_app'), appUrl);
    mk('ghost', T.ui.ctaShare, share);
  }else{
    mk('', T.ui.ctaChat.replace('{n}',nm), ()=>stat('quiz_to_app'), appUrl);
    mk('soft', T.ui.ctaShare, share);
    mk('ghost', T.ui.ctaRetry, ()=>{ history.replaceState(null,'','?lang='+LANG); step=0; answers=[]; paintQ(); show('quiz'); });
  }

  function share(){
    stat('quiz_share',id);
    const url=location.origin+location.pathname+'?r='+id+'&lang='+LANG;
    const text=T.ui.shareText.replace('{n}',nm).replace('{k}',r.k);
    if(navigator.share){ navigator.share({title:T.ui.docTitle,text,url}).catch(()=>{}); }
    else{
      (navigator.clipboard?navigator.clipboard.writeText(text+'\n'+url):Promise.reject())
        .then(()=>toast(T.ui.copied))
        .catch(()=>{ prompt('', text+'\n'+url); });
    }
  }
}
let toastTm=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTm); toastTm=setTimeout(()=>t.classList.remove('on'),2400); }

// ── 시작: 공유 링크(?r=)면 결과 화면부터
paintIntro();
const rid=params.get('r');
if(rid && DATA[LANG].r[rid]){ paintResult(rid,true); show('res'); }
</script>
