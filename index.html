<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>철크크 — 죽은 철학자들의 단톡방</title>
<meta name="theme-color" content="#12141d">
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141d; --ink-soft:#1b1e2b; --ink-line:rgba(239,232,218,.12);
    --paper:#efe8da; --paper-dim:#b9b2a2; --candle:#d9a05b; --on:#4caf7d;
    --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
    --handwriting:'Nanum Pen Script', 'Gowun Batang', cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);height:100dvh;overflow:hidden}
  .app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}

  .list-head{padding:22px 20px 14px;border-bottom:1px solid var(--ink-line)}
  .list-head .eyebrow{font-size:10px;letter-spacing:.35em;color:var(--candle);margin-bottom:6px}
  .list-head h1{font-family:var(--serif);font-size:22px;font-weight:700}
  .friends{flex:1;overflow-y:auto;padding:6px 0 20px}
  .sec{font-size:11px;letter-spacing:.14em;color:rgba(239,232,218,.4);padding:14px 20px 6px}
  .friend{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--paper);transition:background .15s;position:relative}
  .friend:hover{background:rgba(239,232,218,.04)}
  .friend:focus-visible{outline:2px solid var(--candle);outline-offset:-2px}
  .avwrap{position:relative;flex-shrink:0}
  .avatar{width:52px;height:52px;border-radius:20px;overflow:hidden}
  .avatar svg{width:100%;height:100%;display:block}
  .dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--on)}
  .dot.off{background:#7a756a}
  .f-mid{flex:1;min-width:0;padding-right:26px}
  .f-name{font-size:15.5px;font-weight:700}
  .f-status{font-size:11px;color:rgba(217,160,91,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .f-preview{font-size:12.5px;color:rgba(239,232,218,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .f-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .f-time{font-size:10.5px;color:rgba(239,232,218,.35)}
  .badge{min-width:19px;height:19px;border-radius:10px;background:#c25b4e;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}

  .tabbar{display:flex;border-top:1px solid var(--ink-line);background:var(--ink)}
  .tab{flex:1;background:none;border:none;color:var(--paper-dim);font-family:var(--sans);font-size:13.5px;padding:13px 0 calc(13px + env(safe-area-inset-bottom));cursor:pointer;position:relative}
  .tab.on{color:var(--candle);font-weight:700}

  .cube-view{flex:1;overflow-y:auto;padding:16px 18px 8px}
  .cube-cap{font-size:11.5px;color:rgba(239,232,218,.45);margin-bottom:6px;line-height:1.7}
  .cube-info{margin-top:16px;padding:13px 2px 4px;border-top:1px solid var(--ink-line);font-size:12.5px;color:var(--paper-dim);line-height:1.75;min-height:96px}
  .cube-foot{font-size:10.5px;color:rgba(239,232,218,.3);text-align:center;line-height:1.6;padding:18px 0 10px}

  .splash{position:absolute;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s}
  .splash.hide{opacity:0;pointer-events:none}
  .sp-grid{display:grid;grid-template-columns:repeat(3,54px);gap:9px;margin-bottom:22px}
  .sp-grid .avatar{width:54px;height:54px;border-radius:18px}
  .sp-eyebrow{font-size:10px;letter-spacing:.35em;color:var(--paper-dim);margin-bottom:6px}
  .sp-title{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--candle)}

  .chat{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;z-index:5}
  .chat.open{transform:none}
  .chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ink-line);background:var(--ink)}
  .back{background:none;border:none;color:var(--paper);font-size:22px;cursor:pointer;padding:6px 8px;line-height:1}
  .chat-head .avatar{width:38px;height:38px;border-radius:14px}
  .chat-head .c-name{font-size:15px;font-weight:700}
  .chat-head .c-status{font-size:11px;color:var(--paper-dim);margin-top:1px}
  .msgs{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:4px}
  .mrow{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
  .mrow.me{flex-direction:row-reverse}
  .mrow .avatar{width:34px;height:34px;border-radius:13px;align-self:flex-start;cursor:pointer}
  .bcol{display:flex;flex-direction:column;max-width:72%}
  .who{font-size:10.5px;color:var(--paper-dim);margin:0 0 3px 2px}
  .bubble{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .them .bubble{background:var(--paper);color:#1d1f28;border-top-left-radius:4px;font-family:var(--serif);font-weight:600;font-size:14px}
  .me .bubble{background:var(--candle);color:#1d1f28;border-top-right-radius:4px;max-width:100%}
  .me .bcol{align-items:flex-end}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:10px;color:rgba(239,232,218,.4);flex-shrink:0}

  .inputbar{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ink-line);background:var(--ink)}
  .inputbar textarea{flex:1;background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:20px;padding:10px 16px;color:var(--paper);font-family:var(--sans);font-size:14px;resize:none;outline:none;max-height:90px;line-height:1.5}
  .inputbar textarea:focus{border-color:var(--candle)}
  .send{width:42px;height:42px;border-radius:50%;border:none;background:var(--candle);color:var(--ink);font-size:17px;cursor:pointer;flex-shrink:0}

  /* ===== 독립형 퀘스트 카드 ===== */
  .quest-card{margin:10px 12px 4px;padding:12px 14px;background:rgba(217,160,91,.08);border:1px dashed rgba(217,160,91,.4);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .quest-txt{font-size:13px;color:var(--paper);line-height:1.4}
  .quest-txt span{display:block;font-size:10.5px;color:var(--candle);font-weight:700;margin-bottom:2px}
  .dy-done{background:none;border:1px solid var(--candle);color:var(--candle);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all .2s}
  .dy-done.is-done{background:var(--candle);color:var(--ink);font-weight:700}

  /* ===== 오늘 한 줄 / 서랍장 일기 노란 노트 카드 ===== */
  .dy-card{margin:6px 12px 10px;padding:14px 16px;border:1px solid rgba(217,160,91,.3);border-radius:16px;background:radial-gradient(circle at top left, rgba(239,232,218,.08), rgba(27,30,43,.95));box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative}
  .dy-head{font-size:12.5px;color:var(--paper-dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px dashed var(--ink-line);padding-bottom:6px}
  .dy-desc{font-size:11.5px;color:var(--paper-dim);line-height:1.5;background:rgba(239,232,218,.04);padding:8px 10px;border-radius:8px;border-left:2px solid var(--candle);margin-bottom:10px}
  .dy-row{display:flex;gap:7px;margin-bottom:8px}
  .dy-in{flex:1;background:var(--ink);border:1px solid var(--ink-line);border-radius:9px;color:var(--paper);padding:9px 12px;font-size:14px;font-family:var(--handwriting);outline:none;letter-spacing:.5px}
  .dy-in:focus{border-color:var(--candle)}
  .dy-go{background:var(--candle);color:var(--ink);border:0;border-radius:9px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer}
  
  .dy-mine-box{background:rgba(239,232,218,.03);padding:10px 12px;border-radius:10px;border:1px solid rgba(239,232,218,.08);margin-top:6px}
  .dy-mine-line{font-family:var(--handwriting);font-size:20px;line-height:1.5;color:#efe8da;word-break:break-word;letter-spacing:.5px}
  
  .dy-comments-area{margin-top:10px;padding-top:8px;border-top:1px dashed var(--ink-line)}
  .dy-toggle-btn{background:none;border:none;color:var(--candle);font-size:12px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;font-family:var(--sans)}
  .dy-re-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .dy-re{display:flex;gap:8px;align-items:flex-start;background:rgba(239,232,218,.03);padding:8px 10px;border-radius:10px}
  .dy-re .avatar{width:28px;height:28px;flex:none;border-radius:9px;overflow:hidden}
  .dy-re-txt{font-size:13px;line-height:1.55;color:var(--paper)}
  .dy-re-txt b{color:var(--candle);font-weight:700;margin-right:4px}

  /* ===== 서랍장 & 캘린더 ===== */
  .mail-view{flex:1;overflow-y:auto;padding:6px 16px 90px}
  .dr-seg{display:flex;gap:8px;padding:10px 14px 4px}
  .dr-seg button{flex:1;background:var(--ink-soft);border:1px solid var(--ink-line);color:var(--paper-dim);border-radius:10px;padding:8px 0;font-size:13.5px;font-family:var(--sans);cursor:pointer}
  .dr-seg button.on{color:var(--ink);background:var(--candle);border-color:var(--candle);font-weight:700}
  
  .cal-head{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 6px}
  .cal-nav{background:none;border:0;color:var(--candle);font-size:22px;cursor:pointer;padding:0 8px}
  .cal-selects{display:flex;align-items:center;gap:6px}
  .cal-selects select{background:var(--ink-soft);color:var(--candle);border:1px solid var(--ink-line);border-radius:8px;padding:4px 8px;font-size:14px;font-family:var(--serif);font-weight:700;outline:none;cursor:pointer}
  
  .month-progress{text-align:center;font-size:11.5px;color:var(--paper-dim);margin-bottom:10px}
  .progress-bar-bg{width:75%;height:6px;background:var(--ink-soft);border-radius:3px;margin:4px auto 0;overflow:hidden;border:1px solid var(--ink-line)}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg, var(--candle), #e8c07d);border-radius:3px;transition:width .3s ease}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 8px}
  .cal-wd{text-align:center;font-size:11px;color:var(--paper-dim);padding:4px 0}
  .cal-cell{position:relative;aspect-ratio:1;background:none;border:1px solid transparent;border-radius:10px;color:var(--paper-dim);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:default;font-size:12.5px}
  .cal-cell.has{color:#fff;cursor:pointer;background:rgba(217,160,91,.22);border:1px solid var(--candle);box-shadow:0 0 8px rgba(217,160,91,.2);font-weight:700}
  .cal-cell.today{border-color:#fff}
  .cal-n{line-height:1}
  .cal-mk{font-size:10px;line-height:1;min-height:11px}

  .dy-h-item{margin-bottom:12px}
  .dy-h-date{font-size:12px;color:var(--candle);margin-bottom:6px;font-weight:700}

  .overlay{position:absolute;inset:0;background:var(--ink);z-index:20;display:none;flex-direction:column}
  .overlay.on{display:flex}
  .ov-close{position:absolute;top:18px;right:12px;background:none;border:none;color:var(--paper-dim);font-size:17px;cursor:pointer;padding:10px;z-index:1}
  .gear{position:absolute;top:16px;right:10px;background:none;border:none;color:var(--paper-dim);font-size:19px;cursor:pointer;padding:10px;z-index:2}
</style>
</head>
<body>
<div class="app">

  <div class="list-head">
    <div class="eyebrow">죽은 철학자들의 단톡방</div>
    <h1>철크크</h1>
    <button class="gear" id="btnSettings" aria-label="설정">⚙️</button>
  </div>

  <div class="friends" id="friends"></div>

  <div class="cube-view" id="cubeView" style="display:none">
    <div class="cube-cap">가로줄은 온도(때리기→받아주기→가라앉히기), 세로줄은 방법(삶의 태도·내면 성찰·규율과 도리). 정중앙엔 질문이 삽니다.</div>
    <div id="cubeRows"></div>
    <div class="cube-info" id="cubeInfo">철학자를 눌러 소개를 확인해보세요.</div>
    <div class="cube-foot">철학적 사유를 빌린 대화 도구이며, 심리 상담·치료가 아닙니다.<br>마음이 많이 힘들다면 전문 상담기관의 도움을 받아 보세요.</div>
  </div>

  <div class="mail-view" id="mailView" style="display:none">
    <div class="dr-seg">
      <button id="segDiary" class="on">일기 서랍장</button>
      <button id="segMail">우편함</button>
    </div>
    
    <div id="diaryPane">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev">‹</button>
        <div class="cal-selects">
          <select id="calYearSelect"></select>
          <select id="calMonthSelect"></select>
        </div>
        <button class="cal-nav" id="calNext">›</button>
      </div>

      <div class="month-progress" id="monthProgress">
        <div id="progressTxt">이번 달 채운 날: 0일 (0%)</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
      </div>

      <div class="cal-grid" id="calGrid"></div>
      <div id="diaryHistList" style="margin-top:16px;"></div>
    </div>

    <div id="mailPane" style="display:none">
      <div class="mail-hint" style="text-align:center;padding:30px;color:var(--paper-dim);">
        매월 1일, 나눈 대화가 가장 많았던 철학자가 한 달을 돌아보는 편지를 보냅니다.
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab" id="tabCube">▦ 프로필</button>
    <button class="tab on" id="tabChat">💬 채팅</button>
    <button class="tab" id="tabMail">🗄 서랍장</button>
  </div>

  <div class="chat" id="chat">
    <div class="chat-head">
      <button class="back" id="backBtn" aria-label="뒤로">‹</button>
      <div class="avwrap" id="chatAvWrap"><div class="avatar" id="chatAvatar"></div></div>
      <div id="chatTitle"><div class="c-name" id="chatName"></div><div class="c-status" id="chatStatus"></div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <textarea id="input" rows="1" placeholder="메시지 보내기"></textarea>
      <button class="send" id="sendBtn" aria-label="전송">↑</button>
    </div>
  </div>

  <div class="splash" id="splash">
    <div class="sp-eyebrow">죽은 철학자들의 단톡방</div>
    <div class="sp-title">철크크</div>
  </div>

</div>

<script>
/* ================= 철학자 데이터 (9인) ================= */
const PHILOSOPHERS = [
  { id: 'socrates', name: '소크라테스', desc: '질문으로 생각을 파헤치는 할아버지' },
  { id: 'nietzsche', name: '니체', desc: '망치를 들고 나를 극복하라는 열혈남' },
  { id: 'kant', name: '칸트', desc: '규율과 정언명령의 원칙주의 선생님' },
  { id: 'epicurus', name: '에피쿠로스', desc: '정원에서 빵을 나누는 따뜻한 단짝' },
  { id: 'zhuangzi', name: '장자', desc: '나비꿈을 꾸는 한가한 4차원 이야기꾼' },
  { id: 'schopenhauer', name: '쇼펜하우어', desc: '쯧, 독설 뒤에 처방을 주는 츤데레' },
  { id: 'confucius', name: '공자', desc: '도리와 어울림을 일깨우는 마을 어른' },
  { id: 'aurelius', name: '아우렐리우스', desc: '통제 가능한 것에 집중하는 과묵한 황제' },
  { id: 'kierkegaard', name: '키르케고르', desc: '새벽의 불안을 응시하는 소설가' }
];

function getAvatarSvg(id) {
  const colors = {
    socrates: '#7d8a5c', nietzsche: '#a2402f', kant: '#3f5573',
    epicurus: '#c9944a', zhuangzi: '#4e7d6b', schopenhauer: '#5a5561',
    confucius: '#9c7135', aurelius: '#6b4e8a', kierkegaard: '#37474f'
  };
  const bg = colors[id] || '#7d8a5c';
  return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="80" height="80" fill="${bg}"/>
    <circle cx="40" cy="36" r="20" fill="#f0e6d3"/>
    <circle cx="33" cy="35" r="2" fill="#1d1f28"/>
    <circle cx="47" cy="35" r="2" fill="#1d1f28"/>
    <path d="M35 46 q5 4 10 0" stroke="#1d1f28" stroke-width="2" fill="none"/>
  </svg>`;
}

/* ================= 상태 관리 & 앱 로직 ================= */
let diaryState = JSON.parse(localStorage.getItem('cheolkk-diary-v3') || '{}');
let activeTab = 'chat';
let isCommentsExpanded = false;
let isLinesExpanded = false;
let currentCalDate = new Date();

function saveDiaryState() {
  localStorage.setItem('cheolkk-diary-v3', JSON.stringify(diaryState));
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* 철학자 댓글 자동 생성 (하루 9명 1인 1회 제한) */
function generatePhilosopherReply(userLine, dateKey) {
  if (!diaryState[dateKey]) {
    diaryState[dateKey] = { lines: [], replies: [], questDone: false };
  }

  const todayData = diaryState[dateKey];
  const usedIds = (todayData.replies || []).map(r => r.philosopherId);

  // 아직 안 한 철학자 추출
  const available = PHILOSOPHERS.filter(p => !usedIds.includes(p.id));
  if (available.length === 0) return; // 이미 9명 모두 댓글 작성 완료

  // 무작위로 1명 선정
  const selected = available[Math.floor(Math.random() * available.length)];

  const sampleReplies = {
    socrates: `"${userLine}"… 거기에 네 진짜 마음이 담겨 있는가?`,
    nietzsche: `좋다! "${userLine}"라는 진통을 딛고 오늘을 뛰어넘어라!`,
    kant: `오늘의 기록 완료. 해당 일과의 가치를 엄밀히 점검하기 바람.`,
    epicurus: `오늘 하루 고생 많았어요. 따뜻한 차 한 잔 마시고 편히 쉬어요~`,
    zhuangzi: `팔랑팔랑~ 그것이 일기인가, 아니면 일기가 나인가 🦋`,
    schopenhauer: `쯧, 세상이 원래 그렇지. 너무 기대하지 말고 쉬어라.`,
    confucius: `허허, 그 한 줄의 도리를 스스로 돌아보니 기쁘지 아니한가.`,
    aurelius: `통제할 수 있는 일에만 마음을 쓰고, 마음의 평정을 지키라.`,
    kierkegaard: `불안 속에서도 나직이 써 내려간 한 줄… (멋진 기록이다.)`
  };

  const text = sampleReplies[selected.id] || `오늘 그 한 줄이 마음에 울림을 주네.`;

  todayData.replies.push({
    philosopherId: selected.id,
    text: text,
    time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  });

  saveDiaryState();
}

/* UI 업데이트 */
function renderFriendsList() {
  const friendsEl = document.getElementById('friends');
  const todayKey = getTodayKey();
  const todayData = diaryState[todayKey] || { lines: [], replies: [], questDone: false };

  let html = '';

  // 1. 독립된 퀘스트 카드 (오늘 한 줄 위 배치)
  html += `
    <div class="quest-card">
      <div class="quest-txt">
        <span>MISSION · 오늘의 작은 미션</span>
        오늘 나 자신에게 솔직한 한마디를 건네보셨나요?
      </div>
      <button class="dy-done ${todayData.questDone ? 'is-done' : ''}" id="btnQuestDone">
        ${todayData.questDone ? '완료됨 ✓' : '했어요 ✓'}
      </button>
    </div>
  `;

  // 2. 사각사각 노란 노트 스타일의 '오늘 한 줄' 카드
  const hasLines = todayData.lines && todayData.lines.length > 0;
  const replyCount = (todayData.replies || []).length;

  html += `
    <div class="dy-card">
      <div class="dy-head">
        <span>✏️ 오늘 한 줄 기록하기</span>
        <span>${todayKey}</span>
      </div>
      <div class="dy-desc">
        💡 <b>오늘 한 줄이란?</b><br>
        오늘 있었던 일, 감정, 생각 등 무엇이든 한 줄씩 가볍게 적어보세요. 철학자들이 하루에 한 번씩 다정한 한 마디를 남겨줍니다.
      </div>
      <div class="dy-row">
        <input type="text" class="dy-in" id="dyInput" placeholder="사각사각, 오늘을 한 줄로 남겨보세요..." />
        <button class="dy-go" id="dySaveBtn">남기기</button>
      </div>
  `;

  if (hasLines) {
    const latestLine = todayData.lines[todayData.lines.length - 1];
    
    html += `
      <div class="dy-mine-box">
        <div class="dy-mine-line">"${latestLine}"</div>
      </div>
    `;

    // 오늘 작성한 모든 줄 보기 버튼
    if (todayData.lines.length > 1) {
      html += `
        <button class="dy-toggle-btn" id="btnToggleLines">
          ${isLinesExpanded ? '▲ 오늘의 이전 한 줄 접기' : `▼ 오늘 남긴 모든 줄 보기 (${todayData.lines.length}개)`}
        </button>
      `;

      if (isLinesExpanded) {
        html += `<div style="margin-top:6px;display:flex;flex-direction:column;gap:6px;">`;
        todayData.lines.forEach((line, idx) => {
          html += `<div class="dy-mine-line" style="font-size:16px;opacity:.85;">• ${line}</div>`;
        });
        html += `</div>`;
      }
    }

    // 철학자 댓글 (접기/펼치기)
    if (replyCount > 0) {
      html += `
        <div class="dy-comments-area">
          <button class="dy-toggle-btn" id="btnToggleComments">
            ${isCommentsExpanded ? '▲ 댓글 접기' : `💬 철학자 댓글 보기 (${replyCount}/9개)`}
          </button>
      `;

      if (isCommentsExpanded) {
        html += `<div class="dy-re-list">`;
        todayData.replies.forEach(r => {
          const p = PHILOSOPHERS.find(x => x.id === r.philosopherId);
          html += `
            <div class="dy-re">
              <div class="avatar">${getAvatarSvg(r.philosopherId)}</div>
              <div class="dy-re-txt">
                <b>${p ? p.name : '철학자'}</b>: ${r.text}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
  }

  html += `</div>`; // .dy-card 끝

  // 3. 단톡방 / 철학자 대화방 리스트
  html += `<div class="sec">철학자 단톡방 목록</div>`;
  PHILOSOPHERS.forEach(p => {
    html += `
      <div class="friend" onclick="openChat('${p.id}')">
        <div class="avwrap">
          <div class="avatar">${getAvatarSvg(p.id)}</div>
          <span class="dot"></span>
        </div>
        <div class="f-mid">
          <div class="f-name">${p.name}</div>
          <div class="f-preview">${p.desc}</div>
        </div>
      </div>
    `;
  });

  friendsEl.innerHTML = html;

  // 이벤트 바인딩
  document.getElementById('btnQuestDone')?.addEventListener('click', () => {
    if (!diaryState[todayKey]) diaryState[todayKey] = { lines: [], replies: [], questDone: false };
    diaryState[todayKey].questDone = !diaryState[todayKey].questDone;
    saveDiaryState();
    renderFriendsList();
  });

  document.getElementById('dySaveBtn')?.addEventListener('click', () => {
    const input = document.getElementById('dyInput');
    const val = input.value.trim();
    if (!val) return;

    if (!diaryState[todayKey]) diaryState[todayKey] = { lines: [], replies: [], questDone: false };
    diaryState[todayKey].lines.push(val);
    
    // 철학자 댓글 추가 (최대 9명)
    generatePhilosopherReply(val, todayKey);
    
    saveDiaryState();
    renderFriendsList();
  });

  document.getElementById('btnToggleComments')?.addEventListener('click', () => {
    isCommentsExpanded = !isCommentsExpanded;
    renderFriendsList();
  });

  document.getElementById('btnToggleLines')?.addEventListener('click', () => {
    isLinesExpanded = !isLinesExpanded;
    renderFriendsList();
  });
}

/* 캘린더 & 서랍장 일기 렌더링 */
function renderCalendar() {
  const yearSelect = document.getElementById('calYearSelect');
  const monthSelect = document.getElementById('calMonthSelect');
  const grid = document.getElementById('calGrid');
  const list = document.getElementById('diaryHistList');

  const curYear = currentCalDate.getFullYear();
  const curMonth = currentCalDate.getMonth();

  // 드롭다운 옵션 구성
  yearSelect.innerHTML = [2024, 2025, 2026, 2027].map(y => `<option value="${y}" ${y===curYear?'selected':''}>${y}년</option>`).join('');
  monthSelect.innerHTML = Array.from({length:12}, (_,i) => `<option value="${i}" ${i===curMonth?'selected':''}>${i+1}월</option>`).join('');

  // 요일 헤더
  const days = ['일','월','화','수','목','금','토'];
  let gridHtml = days.map(d => `<div class="cal-wd">${d}</div>`).join('');

  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const lastDate = new Date(curYear, curMonth + 1, 0).getDate();

  let filledCount = 0;

  for (let i = 0; i < firstDay; i++) {
    gridHtml += `<div class="cal-cell"></div>`;
  }

  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entry = diaryState[dateStr];
    const hasEntry = entry && entry.lines && entry.lines.length > 0;

    if (hasEntry) filledCount++;

    gridHtml += `
      <div class="cal-cell ${hasEntry ? 'has' : ''}" onclick="showDiaryDetail('${dateStr}')">
        <span class="cal-n">${d}</span>
        <span class="cal-mk">${hasEntry ? '🔥' : ''}</span>
      </div>
    `;
  }

  grid.innerHTML = gridHtml;

  // 진척도 프로그레스 바
  const fillPercent = Math.round((filledCount / lastDate) * 100);
  document.getElementById('progressTxt').innerText = `이번 달 채운 날: ${filledCount}일 / ${lastDate}일 (${fillPercent}%)`;
  document.getElementById('progressBarFill').style.width = `${fillPercent}%`;

  // 서랍장 내 동일 카드 스타일로 일기 리스트 표시
  renderDiaryHistoryCards(curYear, curMonth);
}

/* 서랍장 일기 카드 렌더링 (오늘 한 줄 카드 디자인과 완전 동일) */
function renderDiaryHistoryCards(year, month) {
  const list = document.getElementById('diaryHistList');
  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;

  const keys = Object.keys(diaryState)
    .filter(k => k.startsWith(monthPrefix) && diaryState[k].lines && diaryState[k].lines.length > 0)
    .sort().reverse();

  if (keys.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--paper-dim);font-size:13px;">이 달의 저장된 기록이 없습니다.</div>`;
    return;
  }

  let html = `<div style="font-size:13px;font-weight:700;color:var(--candle);margin-bottom:8px;padding-left:4px;">📜 이 달의 기록들</div>`;

  keys.forEach(k => {
    const data = diaryState[k];
    html += `
      <div class="dy-card" style="margin:0 0 12px 0;">
        <div class="dy-head">
          <span>📅 ${k}</span>
          <span>${data.questDone ? '미션 완료 ✓' : ''}</span>
        </div>
        <div class="dy-mine-box">
          ${data.lines.map(line => `<div class="dy-mine-line">• ${line}</div>`).join('')}
        </div>
    `;

    if (data.replies && data.replies.length > 0) {
      html += `<div class="dy-re-list" style="margin-top:8px;">`;
      data.replies.forEach(r => {
        const p = PHILOSOPHERS.find(x => x.id === r.philosopherId);
        html += `
          <div class="dy-re">
            <div class="avatar">${getAvatarSvg(r.philosopherId)}</div>
            <div class="dy-re-txt">
              <b>${p ? p.name : '철학자'}</b>: ${r.text}
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  list.innerHTML = html;
}

/* 채팅창 열기 */
function openChat(id) {
  const p = PHILOSOPHERS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('chatName').innerText = p.name;
  document.getElementById('chatStatus').innerText = p.desc;
  document.getElementById('chatAvatar').innerHTML = getAvatarSvg(p.id);

  const msgs = document.getElementById('msgs');
  msgs.innerHTML = `
    <div class="mrow them">
      <div class="avatar">${getAvatarSvg(p.id)}</div>
      <div class="bcol">
        <div class="who">${p.name}</div>
        <div class="bubble">어서 오게. 오늘 어떤 질문이 그대의 마음을 두드리고 있는가?</div>
      </div>
    </div>
  `;

  document.getElementById('chat').classList.add('open');
}

/* 초기화 & 이벤트 연동 */
document.addEventListener('DOMContentLoaded', () => {
  // 스플래시 종료
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
  }, 500);

  renderFriendsList();

  // 탭 전환
  document.getElementById('tabChat').addEventListener('click', () => {
    document.getElementById('tabChat').classList.add('on');
    document.getElementById('tabCube').classList.remove('on');
    document.getElementById('tabMail').classList.remove('on');
    document.getElementById('friends').style.display = 'block';
    document.getElementById('cubeView').style.display = 'none';
    document.getElementById('mailView').style.display = 'none';
  });

  document.getElementById('tabCube').addEventListener('click', () => {
    document.getElementById('tabCube').classList.add('on');
    document.getElementById('tabChat').classList.remove('on');
    document.getElementById('tabMail').classList.remove('on');
    document.getElementById('friends').style.display = 'none';
    document.getElementById('cubeView').style.display = 'block';
    document.getElementById('mailView').style.display = 'none';
  });

  document.getElementById('tabMail').addEventListener('click', () => {
    document.getElementById('tabMail').classList.add('on');
    document.getElementById('tabChat').classList.remove('on');
    document.getElementById('tabCube').classList.remove('on');
    document.getElementById('friends').style.display = 'none';
    document.getElementById('cubeView').style.display = 'none';
    document.getElementById('mailView').style.display = 'block';
    renderCalendar();
  });

  // 뒤로가기
  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('chat').classList.remove('open');
  });

  // 캘린더 연도/월 네비게이션
  document.getElementById('calPrev').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('calNext').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById('calYearSelect').addEventListener('change', (e) => {
    currentCalDate.setFullYear(parseInt(e.target.value));
    renderCalendar();
  });

  document.getElementById('calMonthSelect').addEventListener('change', (e) => {
    currentCalDate.setMonth(parseInt(e.target.value));
    renderCalendar();
  });

  // 서랍장 서브 탭
  document.getElementById('segDiary').addEventListener('click', () => {
    document.getElementById('segDiary').classList.add('on');
    document.getElementById('segMail').classList.remove('on');
    document.getElementById('diaryPane').style.display = 'block';
    document.getElementById('mailPane').style.display = 'none';
  });

  document.getElementById('segMail').addEventListener('click', () => {
    document.getElementById('segMail').classList.add('on');
    document.getElementById('segDiary').classList.remove('on');
    document.getElementById('mailPane').style.display = 'block';
    document.getElementById('diaryPane').style.display = 'none';
  });
});
</script>
