<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>철크크 — 죽은 철학자들의 단톡방</title>
<meta name="theme-color" content="#12141d">
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141d; --ink-soft:#1b1e2b; --ink-line:rgba(239,232,218,.12);
    --paper:#efe8da; --paper-dim:#b9b2a2; --candle:#d9a05b; --on:#4caf7d;
    --serif:'Gowun Batang', 'Noto Serif KR', serif;
    --sans:'Gowun Dodum', 'Noto Sans KR', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);height:100dvh;overflow:hidden}
  .app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}

  .list-head{padding:22px 20px 14px;border-bottom:1px solid var(--ink-line);position:relative}
  .list-head .eyebrow{font-size:10px;letter-spacing:.35em;color:var(--candle);margin-bottom:6px}
  .list-head h1{font-family:var(--serif);font-size:22px;font-weight:700}
  .gear{position:absolute;top:20px;right:18px;background:none;border:none;color:var(--paper-dim);font-size:19px;cursor:pointer}

  .friends{flex:1;overflow-y:auto;padding:6px 0 20px}
  .sec{font-size:11px;letter-spacing:.14em;color:rgba(239,232,218,.4);padding:14px 20px 6px}
  .friend{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--paper);transition:background .15s}
  .friend:hover{background:rgba(239,232,218,.04)}
  
  .avwrap{position:relative;flex-shrink:0}
  .avatar{width:52px;height:52px;border-radius:18px;overflow:hidden;background:#232736;display:flex;align-items:center;justify-content:center;border:1px solid rgba(239,232,218,.1)}
  .avatar svg{width:100%;height:100%;display:block}
  .dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--on)}

  .f-mid{flex:1;min-width:0}
  .f-name{font-size:15.5px;font-weight:700;font-family:var(--serif)}
  .f-preview{font-size:12.5px;color:rgba(239,232,218,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

  .tabbar{display:flex;border-top:1px solid var(--ink-line);background:var(--ink)}
  .tab{flex:1;background:none;border:none;color:var(--paper-dim);font-family:var(--sans);font-size:13.5px;padding:13px 0 calc(13px + env(safe-area-inset-bottom));cursor:pointer}
  .tab.on{color:var(--candle);font-weight:700}

  /* ===== 철학자 미션 카드 ===== */
  .quest-card{margin:10px 14px 4px;padding:12px 14px;background:rgba(217,160,91,.08);border:1px dashed rgba(217,160,91,.4);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .quest-txt{font-size:12.5px;color:var(--paper);line-height:1.4}
  .quest-txt span{display:block;font-size:11px;color:var(--candle);font-weight:700;margin-bottom:2px}
  .dy-done{background:none;border:1px solid var(--candle);color:var(--candle);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all .2s}
  .dy-done.is-done{background:var(--candle);color:var(--ink);font-weight:700}

  /* ===== 오늘 한 줄 카드 ===== */
  .dy-card{margin:8px 14px 12px;padding:16px;border:1px solid rgba(217,160,91,.3);border-radius:16px;background:radial-gradient(circle at top left, rgba(239,232,218,.07), rgba(27,30,43,.95));box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .dy-head{font-size:12px;color:var(--paper-dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px dashed var(--ink-line);padding-bottom:6px}
  .dy-desc{font-size:12px;color:var(--paper-dim);line-height:1.6;background:rgba(239,232,218,.04);padding:9px 11px;border-radius:9px;border-left:3px solid var(--candle);margin-bottom:12px;font-family:var(--serif)}
  .dy-row{display:flex;gap:8px;margin-bottom:8px}
  .dy-in{flex:1;background:var(--ink);border:1px solid var(--ink-line);border-radius:10px;color:var(--paper);padding:10px 12px;font-size:14px;font-family:var(--serif);outline:none}
  .dy-in:focus{border-color:var(--candle)}
  .dy-go{background:var(--candle);color:var(--ink);border:0;border-radius:10px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer}
  
  .dy-mine-box{background:rgba(239,232,218,.03);padding:12px;border-radius:10px;border:1px solid rgba(239,232,218,.08);margin-top:6px}
  .dy-mine-line{font-family:var(--serif);font-size:15px;line-height:1.6;color:#efe8da;word-break:break-word}
  
  .dy-comments-area{margin-top:10px;padding-top:8px;border-top:1px dashed var(--ink-line)}
  .dy-toggle-btn{background:none;border:none;color:var(--candle);font-size:12px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;font-family:var(--sans)}
  .dy-re-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .dy-re{display:flex;gap:10px;align-items:flex-start;background:rgba(239,232,218,.03);padding:10px;border-radius:10px}
  .dy-re .avatar{width:32px;height:32px;flex:none;border-radius:12px;overflow:hidden}
  .dy-re-txt{font-size:13px;line-height:1.55;color:var(--paper);font-family:var(--serif)}
  .dy-re-txt b{color:var(--candle);font-weight:700;margin-right:4px}

  /* ===== 서랍장 & 캘린더 ===== */
  .mail-view{flex:1;overflow-y:auto;padding:10px 16px 90px}
  .dr-seg{display:flex;gap:8px;margin-bottom:14px}
  .dr-seg button{flex:1;background:var(--ink-soft);border:1px solid var(--ink-line);color:var(--paper-dim);border-radius:10px;padding:9px 0;font-size:13.5px;font-family:var(--sans);cursor:pointer}
  .dr-seg button.on{color:var(--ink);background:var(--candle);border-color:var(--candle);font-weight:700}
  
  .cal-head{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 10px}
  .cal-nav{background:none;border:0;color:var(--candle);font-size:20px;cursor:pointer;padding:0 6px}
  .cal-selects{display:flex;align-items:center;gap:6px}
  .cal-selects select{background:var(--ink-soft);color:var(--candle);border:1px solid var(--ink-line);border-radius:8px;padding:5px 8px;font-size:14px;font-family:var(--serif);font-weight:700;outline:none;cursor:pointer}
  
  .month-progress{text-align:center;font-size:12px;color:var(--paper-dim);margin-bottom:14px}
  .progress-bar-bg{width:80%;height:6px;background:var(--ink-soft);border-radius:3px;margin:6px auto 0;overflow:hidden;border:1px solid var(--ink-line)}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg, var(--candle), #e8c07d);border-radius:3px;transition:width .3s ease}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 4px}
  .cal-wd{text-align:center;font-size:11px;color:var(--paper-dim);padding:4px 0}
  .cal-cell{position:relative;aspect-ratio:1;background:none;border:1px solid transparent;border-radius:10px;color:var(--paper-dim);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px}
  .cal-cell.has{color:#fff;cursor:pointer;background:rgba(217,160,91,.2);border:1px solid var(--candle);font-weight:700}
  .cal-cell.today{border-color:#fff}

  /* 프로필 / 세부 채팅 */
  .chat{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;z-index:10}
  .chat.open{transform:none}
  .chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ink-line);background:var(--ink)}
  .back{background:none;border:none;color:var(--paper);font-size:22px;cursor:pointer;padding:4px 8px}
  .chat-head .avatar{width:38px;height:38px;border-radius:14px}
  .chat-head .c-name{font-size:15px;font-weight:700;font-family:var(--serif)}
  .chat-head .c-status{font-size:11px;color:var(--paper-dim)}
  .msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
  .mrow{display:flex;align-items:flex-end;gap:8px}
  .mrow .avatar{width:34px;height:34px;border-radius:12px;align-self:flex-start}
  .bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;background:var(--paper);color:#1d1f28;font-family:var(--serif);border-top-left-radius:4px}
  
  .inputbar{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ink-line);background:var(--ink)}
  .inputbar textarea{flex:1;background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:20px;padding:10px 16px;color:var(--paper);font-family:var(--sans);font-size:14px;resize:none;outline:none}
  .send{width:42px;height:42px;border-radius:50%;border:none;background:var(--candle);color:var(--ink);font-size:17px;cursor:pointer}

  .splash{position:absolute;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
  .splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="app">

  <div class="list-head">
    <div class="eyebrow">죽은 철학자들의 단톡방</div>
    <h1>철크크</h1>
    <button class="gear" id="btnSettings">⚙️</button>
  </div>

  <div class="friends" id="friends"></div>

  <div class="mail-view" id="mailView" style="display:none">
    <div class="dr-seg">
      <button id="segDiary" class="on">일기</button>
      <button id="segMail">우편함</button>
    </div>
    
    <div id="diaryPane">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev">‹</button>
        <div class="cal-selects">
          <select id="calYearSelect"></select>
          <select id="calMonthSelect"></select>
        </div>
        <button class="cal-nav" id="calNext">›</button>
      </div>

      <div class="month-progress" id="monthProgress">
        <div id="progressTxt">이달의 사유 기록: 0일 / 30일 (0%)</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
      </div>

      <div class="cal-grid" id="calGrid"></div>
      <div id="diaryHistList" style="margin-top:16px;"></div>
    </div>

    <div id="mailPane" style="display:none">
      <div style="text-align:center;padding:30px;color:var(--paper-dim);font-size:13px;line-height:1.6;">
        매월 1일, 나눈 대화가 가장 많았던 철학자가 한 달을 돌아보는 편지를 보냅니다.
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab on" id="tabChat">💬 채팅</button>
    <button class="tab" id="tabMail">🗄 서랍장</button>
  </div>

  <div class="chat" id="chat">
    <div class="chat-head">
      <button class="back" id="backBtn">‹</button>
      <div class="avatar" id="chatAvatar"></div>
      <div><div class="c-name" id="chatName"></div><div class="c-status" id="chatStatus"></div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <textarea id="input" rows="1" placeholder="메시지 보내기"></textarea>
      <button class="send" id="sendBtn">↑</button>
    </div>
  </div>

  <div class="splash" id="splash">
    <div style="font-size:10px;letter-spacing:.35em;color:var(--paper-dim);margin-bottom:6px;">죽은 철학자들의 단톡방</div>
    <div style="font-family:var(--serif);font-size:30px;font-weight:700;color:var(--candle);">철크크</div>
  </div>

</div>

<script>
/* ================= 철학자 9인 고유 SVG 아바타 복원 ================= */
const PHILOSOPHERS = [
  { id: 'socrates', name: '소크라테스', desc: '질문으로 생각을 파헤치는 할아버지' },
  { id: 'nietzsche', name: '니체', desc: '망치를 들고 나를 극복하라는 열혈남' },
  { id: 'kant', name: '칸트', desc: '규율과 정언명령의 원칙주의 선생님' },
  { id: 'epicurus', name: '에피쿠로스', desc: '정원에서 빵을 나누는 따뜻한 단짝' },
  { id: 'zhuangzi', name: '장자', desc: '나비꿈을 꾸는 한가한 4차원 이야기꾼' },
  { id: 'schopenhauer', name: '쇼펜하우어', desc: '쯧, 독설 뒤에 처방을 주는 츤데레' },
  { id: 'confucius', name: '공자', desc: '도리와 어울림을 일깨우는 마을 어른' },
  { id: 'aurelius', name: '아우렐리우스', desc: '통제 가능한 것에 집중하는 과묵한 황제' },
  { id: 'kierkegaard', name: '키르케고르', desc: '새벽의 불안을 응시하는 소설가' }
];

function getAvatarSvg(id) {
  // 철학자별 고유 이목구비 및 스타일 완벽 구현
  switch(id) {
    case 'socrates':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#4d5940"/><circle cx="40" cy="38" r="19" fill="#f4e7d3"/><path d="M22 36 c2-12 34-12 36 0" fill="#d9d0c1"/><circle cx="33" cy="36" r="2" fill="#2b261f"/><circle cx="47" cy="36" r="2" fill="#2b261f"/><path d="M24 42 c0 15 32 15 32 0" fill="#e3dad0"/></svg>`;
    case 'nietzsche':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#7a2e22"/><circle cx="40" cy="38" r="19" fill="#f8ece0"/><path d="M20 28 c5-10 35-10 40 0" fill="#3a2518"/><path d="M26 33 q8-4 14 0" stroke="#3a2518" stroke-width="2.5" fill="none"/><path d="M40 33 q8-4 14 0" stroke="#3a2518" stroke-width="2.5" fill="none"/><path d="M25 41 q15 8 30 0 c2 6-32 6-30 0" fill="#21130b"/><circle cx="33" cy="36" r="2" fill="#21130b"/><circle cx="47" cy="36" r="2" fill="#21130b"/></svg>`;
    case 'kant':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#2b3e59"/><circle cx="40" cy="38" r="18" fill="#f9ebd8"/><path d="M20 26 c-4 10 0 20 5 20 c5 0 2-16 15-16 s10 16 15 16 c5 0 9-10 5-20" fill="#e6e1da"/><circle cx="33" cy="37" r="2" fill="#1b212b"/><circle cx="47" cy="37" r="2" fill="#1b212b"/><path d="M35 46 q5 3 10 0" stroke="#1b212b" stroke-width="2" fill="none"/></svg>`;
    case 'epicurus':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#8c622b"/><circle cx="40" cy="38" r="19" fill="#f7eae0"/><path d="M22 28 q18-8 36 0" stroke="#486e38" stroke-width="4" fill="none"/><path d="M23 40 c0 12 34 12 34 0" fill="#5c4938"/><circle cx="33" cy="36" r="2" fill="#291c10"/><circle cx="47" cy="36" r="2" fill="#291c10"/><path d="M34 44 q6 5 12 0" stroke="#291c10" stroke-width="2" fill="none"/></svg>`;
    case 'zhuangzi':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#325446"/><circle cx="40" cy="40" r="18" fill="#f9e8d2"/><path d="M34 16 h12 v8 h-12 z" fill="#1f1a17"/><circle cx="40" cy="16" r="4" fill="#1f1a17"/><circle cx="33" cy="37" r="2" fill="#1f1a17"/><circle cx="47" cy="37" r="2" fill="#1f1a17"/><path d="M26 44 c0 10 28 10 28 0" fill="#2e2520"/></svg>`;
    case 'schopenhauer':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#423e4a"/><circle cx="40" cy="40" r="18" fill="#faede1"/><path d="M16 26 c12 2 12 18 12 18" stroke="#ded8d0" stroke-width="6" fill="none"/><path d="M64 26 c-12 2-12 18-12 18" stroke="#ded8d0" stroke-width="6" fill="none"/><circle cx="33" cy="38" r="2" fill="#1d1a21"/><circle cx="47" cy="38" r="2" fill="#1d1a21"/><path d="M35 47 q5-4 10 0" stroke="#1d1a21" stroke-width="2" fill="none"/></svg>`;
    case 'confucius':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#734f24"/><circle cx="40" cy="40" r="18" fill="#f7e4ce"/><path d="M24 20 h32 v12 h-32 z" fill="#241911"/><path d="M20 30 h40 v4 h-40 z" fill="#d9a05b"/><circle cx="33" cy="38" r="2" fill="#241911"/><circle cx="47" cy="38" r="2" fill="#241911"/><path d="M26 42 c0 14 28 14 28 0" fill="#e8ded1"/></svg>`;
    case 'aurelius':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#4d3563"/><circle cx="40" cy="38" r="19" fill="#faebd7"/><path d="M21 30 q19-6 38 0" stroke="#d9a05b" stroke-width="4" fill="none"/><path d="M22 38 c0 14 36 14 36 0" fill="#4a3728"/><circle cx="33" cy="36" r="2" fill="#211710"/><circle cx="47" cy="36" r="2" fill="#211710"/></svg>`;
    case 'kierkegaard':
      return `<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="#2c383f"/><circle cx="40" cy="38" r="18" fill="#fcf0e3"/><path d="M22 28 c8-12 28-12 36 0 c-8-4-28-4-36 0" fill="#523d2d"/><circle cx="33" cy="37" r="2" fill="#1c1611"/><circle cx="47" cy="37" r="2" fill="#1c1611"/><path d="M36 45 q4 2 8 0" stroke="#1c1611" stroke-width="2" fill="none"/></svg>`;
    default:
      return `<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="20" fill="#d9a05b"/></svg>`;
  }
}

/* ================= 앱 상태 관리 ================= */
let diaryState = JSON.parse(localStorage.getItem('cheolkk-diary-v4') || '{}');
let isCommentsExpanded = false;
let currentCalDate = new Date();

function saveDiaryState() {
  localStorage.setItem('cheolkk-diary-v4', JSON.stringify(diaryState));
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* 철학자 댓글 자동 생성 */
function generatePhilosopherReply(userLine, dateKey) {
  if (!diaryState[dateKey]) diaryState[dateKey] = { lines: [], replies: [], questDone: false };
  const todayData = diaryState[dateKey];
  const usedIds = (todayData.replies || []).map(r => r.philosopherId);

  const available = PHILOSOPHERS.filter(p => !usedIds.includes(p.id));
  if (available.length === 0) return;

  const selected = available[Math.floor(Math.random() * available.length)];
  const sampleReplies = {
    socrates: `"${userLine}"… 거기에 네 진짜 마음이 담겨 있는가?`,
    nietzsche: `좋다! "${userLine}"라는 진통을 딛고 오늘을 뛰어넘어라!`,
    kant: `오늘의 기록 완료. 해당 일과의 가치를 엄밀히 점검하기 바람.`,
    epicurus: `오늘 하루 고생 많았어요. 따뜻한 차 한 잔 마시고 편히 쉬어요~`,
    zhuangzi: `팔랑팔랑~ 그것이 일기인가, 아니면 일기가 나인가 🦋`,
    schopenhauer: `쯧, 세상이 원래 그렇지. 너무 기대하지 말고 쉬어라.`,
    confucius: `허허, 그 한 줄의 도리를 스스로 돌아보니 기쁘지 아니한가.`,
    aurelius: `통제할 수 있는 일에만 마음을 쓰고, 마음의 평정을 지키라.`,
    kierkegaard: `불안 속에서도 나직이 써 내려간 한 줄… (멋진 기록이다.)`
  };

  todayData.replies.push({
    philosopherId: selected.id,
    text: sampleReplies[selected.id] || `오늘 그 한 줄이 마음에 울림을 주네.`
  });
  saveDiaryState();
}

/* 메인 뷰 렌더링 */
function renderFriendsList() {
  const friendsEl = document.getElementById('friends');
  const todayKey = getTodayKey();
  const todayData = diaryState[todayKey] || { lines: [], replies: [], questDone: false };

  let html = '';

  // 1. 철학자가 전하는 오늘의 미션
  html += `
    <div class="quest-card">
      <div class="quest-txt">
        <span>📜 오늘의 철학자 미션 (소크라테스)</span>
        “오늘 나 자신에게 솔직한 한마디를 건네보셨나요?”
      </div>
      <button class="dy-done ${todayData.questDone ? 'is-done' : ''}" id="btnQuestDone">
        ${todayData.questDone ? '완료됨 ✓' : '했어요 ✓'}
      </button>
    </div>
  `;

  // 2. 오늘 한 줄 카드 (요청하신 완벽한 문구 적용)
  const hasLines = todayData.lines && todayData.lines.length > 0;
  const replyCount = (todayData.replies || []).length;

  html += `
    <div class="dy-card">
      <div class="dy-head">
        <span>✏️ 오늘 한 줄 기록하기</span>
        <span>${todayKey}</span>
      </div>
      <div class="dy-desc">
        💡 <b>오늘 한 줄이란?</b><br>
        오늘 해내고 싶은 목표와 다짐, 혹은 하루를 돌아보며 남기는 솔직한 일기까지... 마음속 한 줄을 가볍게 적어보세요. 사각사각 적어 내린 당신의 하루에 철학자들이 다정한 이정표를 놓아줍니다.
      </div>
      <div class="dy-row">
        <input type="text" class="dy-in" id="dyInput" placeholder="오늘의 다짐이나 일기를 한 줄로 남겨보세요..." />
        <button class="dy-go" id="dySaveBtn">남기기</button>
      </div>
  `;

  if (hasLines) {
    html += `<div class="dy-mine-box">`;
    todayData.lines.forEach(line => {
      html += `<div class="dy-mine-line">• "${line}"</div>`;
    });
    html += `</div>`;

    if (replyCount > 0) {
      html += `
        <div class="dy-comments-area">
          <button class="dy-toggle-btn" id="btnToggleComments">
            ${isCommentsExpanded ? '▲ 댓글 접기' : `💬 철학자 댓글 보기 (${replyCount}/9개)`}
          </button>
      `;

      if (isCommentsExpanded) {
        html += `<div class="dy-re-list">`;
        todayData.replies.forEach(r => {
          const p = PHILOSOPHERS.find(x => x.id === r.philosopherId);
          html += `
            <div class="dy-re">
              <div class="avatar">${getAvatarSvg(r.philosopherId)}</div>
              <div class="dy-re-txt">
                <b>${p ? p.name : '철학자'}</b>: ${r.text}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
  }

  html += `</div>`; // .dy-card 끝

  // 3. 단톡방 리스트 (프로필 완벽 복원)
  html += `<div class="sec">철학자 단톡방 목록</div>`;
  PHILOSOPHERS.forEach(p => {
    html += `
      <div class="friend" onclick="openChat('${p.id}')">
        <div class="avwrap">
          <div class="avatar">${getAvatarSvg(p.id)}</div>
          <span class="dot"></span>
        </div>
        <div class="f-mid">
          <div class="f-name">${p.name}</div>
          <div class="f-preview">${p.desc}</div>
        </div>
      </div>
    `;
  });

  friendsEl.innerHTML = html;

  // 이벤트 연결
  document.getElementById('btnQuestDone')?.addEventListener('click', () => {
    if (!diaryState[todayKey]) diaryState[todayKey] = { lines: [], replies: [], questDone: false };
    diaryState[todayKey].questDone = !diaryState[todayKey].questDone;
    saveDiaryState();
    renderFriendsList();
  });

  document.getElementById('dySaveBtn')?.addEventListener('click', () => {
    const input = document.getElementById('dyInput');
    const val = input.value.trim();
    if (!val) return;

    if (!diaryState[todayKey]) diaryState[todayKey] = { lines: [], replies: [], questDone: false };
    diaryState[todayKey].lines.push(val);
    generatePhilosopherReply(val, todayKey);
    saveDiaryState();
    renderFriendsList();
  });

  document.getElementById('btnToggleComments')?.addEventListener('click', () => {
    isCommentsExpanded = !isCommentsExpanded;
    renderFriendsList();
  });
}

/* 캘린더 & 서랍장 일기 렌더링 */
function renderCalendar() {
  const yearSelect = document.getElementById('calYearSelect');
  const monthSelect = document.getElementById('calMonthSelect');
  const grid = document.getElementById('calGrid');

  const curYear = currentCalDate.getFullYear();
  const curMonth = currentCalDate.getMonth();

  // 2026년부터 선택 가능하도록 연도 드롭다운 구성
  let yearOpts = '';
  for (let y = 2026; y <= 2035; y++) {
    yearOpts += `<option value="${y}" ${y === curYear ? 'selected' : ''}>${y}년</option>`;
  }
  yearSelect.innerHTML = yearOpts;
  monthSelect.innerHTML = Array.from({length:12}, (_,i) => `<option value="${i}" ${i===curMonth?'selected':''}>${i+1}월</option>`).join('');

  const days = ['일','월','화','수','목','금','토'];
  let gridHtml = days.map(d => `<div class="cal-wd">${d}</div>`).join('');

  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const lastDate = new Date(curYear, curMonth + 1, 0).getDate();
  let filledCount = 0;

  for (let i = 0; i < firstDay; i++) gridHtml += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const entry = diaryState[dateStr];
    const hasEntry = entry && entry.lines && entry.lines.length > 0;

    if (hasEntry) filledCount++;

    gridHtml += `
      <div class="cal-cell ${hasEntry ? 'has' : ''}">
        <span>${d}</span>
        <span style="font-size:10px;">${hasEntry ? '🔥' : ''}</span>
      </div>
    `;
  }

  grid.innerHTML = gridHtml;

  // 개선된 달성도 문구
  const fillPercent = Math.round((filledCount / lastDate) * 100);
  document.getElementById('progressTxt').innerText = `이달의 사유 기록: ${filledCount}일 / ${lastDate}일 (${fillPercent}%)`;
  document.getElementById('progressBarFill').style.width = `${fillPercent}%`;

  renderDiaryHistoryCards(curYear, curMonth);
}

function renderDiaryHistoryCards(year, month) {
  const list = document.getElementById('diaryHistList');
  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;

  const keys = Object.keys(diaryState)
    .filter(k => k.startsWith(monthPrefix) && diaryState[k].lines && diaryState[k].lines.length > 0)
    .sort().reverse();

  if (keys.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--paper-dim);font-size:13px;">이 달의 저장된 기록이 없습니다.</div>`;
    return;
  }

  let html = `<div style="font-size:13px;font-weight:700;color:var(--candle);margin-bottom:8px;">📜 이 달의 기록들</div>`;
  keys.forEach(k => {
    const data = diaryState[k];
    html += `
      <div class="dy-card" style="margin:0 0 12px 0;">
        <div class="dy-head">
          <span>📅 ${k}</span>
          <span>${data.questDone ? '미션 완료 ✓' : ''}</span>
        </div>
        <div class="dy-mine-box">
          ${data.lines.map(line => `<div class="dy-mine-line">• ${line}</div>`).join('')}
        </div>
    `;

    if (data.replies && data.replies.length > 0) {
      html += `<div class="dy-re-list" style="margin-top:8px;">`;
      data.replies.forEach(r => {
        const p = PHILOSOPHERS.find(x => x.id === r.philosopherId);
        html += `
          <div class="dy-re">
            <div class="avatar">${getAvatarSvg(r.philosopherId)}</div>
            <div class="dy-re-txt">
              <b>${p ? p.name : '철학자'}</b>: ${r.text}
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  list.innerHTML = html;
}

function openChat(id) {
  const p = PHILOSOPHERS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('chatName').innerText = p.name;
  document.getElementById('chatStatus').innerText = p.desc;
  document.getElementById('chatAvatar').innerHTML = getAvatarSvg(p.id);

  document.getElementById('msgs').innerHTML = `
    <div class="mrow">
      <div class="avatar">${getAvatarSvg(p.id)}</div>
      <div class="bubble">어서 오게. 오늘 어떤 질문이 그대의 마음을 두드리고 있는가?</div>
    </div>
  `;

  document.getElementById('chat').classList.add('open');
}

/* 실행 및 이벤트 바인딩 */
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.getElementById('splash').classList.add('hide'), 400);

  renderFriendsList();

  document.getElementById('tabChat').addEventListener('click', () => {
    document.getElementById('tabChat').classList.add('on');
    document.getElementById('tabMail').classList.remove('on');
    document.getElementById('friends').style.display = 'block';
    document.getElementById('mailView').style.display = 'none';
  });

  document.getElementById('tabMail').addEventListener('click', () => {
    document.getElementById('tabMail').classList.add('on');
    document.getElementById('tabChat').classList.remove('on');
    document.getElementById('friends').style.display = 'none';
    document.getElementById('mailView').style.display = 'block';
    renderCalendar();
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('chat').classList.remove('open');
  });

  document.getElementById('calPrev').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('calNext').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById('calYearSelect').addEventListener('change', (e) => {
    currentCalDate.setFullYear(parseInt(e.target.value));
    renderCalendar();
  });

  document.getElementById('calMonthSelect').addEventListener('change', (e) => {
    currentCalDate.setMonth(parseInt(e.target.value));
    renderCalendar();
  });

  document.getElementById('segDiary').addEventListener('click', () => {
    document.getElementById('segDiary').classList.add('on');
    document.getElementById('segMail').classList.remove('on');
    document.getElementById('diaryPane').style.display = 'block';
    document.getElementById('mailPane').style.display = 'none';
  });

  document.getElementById('segMail').addEventListener('click', () => {
    document.getElementById('segMail').classList.add('on');
    document.getElementById('segDiary').classList.remove('on');
    document.getElementById('mailPane').style.display = 'block';
    document.getElementById('diaryPane').style.display = 'none';
  });
});
</script>
